# =============================================================================
# HoneyTrack - Production Docker Compose Override
# Usage:
#   SQLite production:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   TimescaleDB production (recommended for high throughput):
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile timescale up -d
# =============================================================================

version: "3.8"

services:
  honeytrack:
    # Run in live mode (no demo simulated events)
    command: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  honeytrack-timescale:
    # Run in live mode (no demo simulated events)
    command: []
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  timescaledb:
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
